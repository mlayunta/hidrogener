<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Hidrógeno verde">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04382d"/>
      <stop offset="0.55" stop-color="#075e49"/>
      <stop offset="1" stop-color="#0d8a63"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7be3ae"/>
      <stop offset="1" stop-color="#22a06b"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dff5ea"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- halo -->
  <circle cx="256" cy="256" r="196" fill="#ffffff" opacity="0.06"/>
  <circle cx="256" cy="256" r="182" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="#72d3a4" stroke-width="10"/>

  <!-- hoja -->
  <path fill="url(#leaf)" d="M292 96c66 8 112 54 116 120-58-1-104-27-130-71-11-19-6-39 14-49z"/>
  <path d="M286 202c30-29 60-50 98-66" fill="none" stroke="#0a6b4a" stroke-width="9" stroke-linecap="round"/>

  <!-- molécula H2 -->
  <circle cx="196" cy="330" r="34" fill="#075e49"/>
  <circle cx="316" cy="330" r="34" fill="#075e49"/>
  <rect x="222" y="320" width="68" height="20" rx="10" fill="#11956e"/>

  <!-- texto -->
  <text x="256" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="150" font-weight="700" fill="#075e49">H</text>
  <text x="256" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="74" font-weight="700" fill="#11956e">2</text>
</svg>
